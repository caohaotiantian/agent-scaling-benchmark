[project]
name = "aibench"
version = "0.1.0"
description = "AI-assisted programming benchmark harness for Agentic Scaling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "jsonschema>=4.22",
  "rich>=13.7",
  "pytest>=8.0",
  "pymysql>=1.2.0",
  "sqlalchemy>=2.0.51",
  "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = []

[project.scripts]
aibench = "aibench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aibench"]

[tool.hatch.build.targets.wheel.sources]
"src/aibench" = "aibench"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
