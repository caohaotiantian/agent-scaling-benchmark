name: shell_cli
version: "0.1.0"
adapter: shell
description: >
  Wrap an external coding CLI (e.g. mini-swe-agent). Fill command_template.
  Placeholders: {workspace} {prompt_file} {case_id} {max_steps}
options:
  # Example only — replace with your CLI:
  # command_template: "mini-swe-agent --workspace {workspace} --prompt-file {prompt_file}"
  command_template: "python -c \"print('configure command_template'); raise SystemExit(1)\""
  env: {}
