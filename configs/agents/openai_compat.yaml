# Production: single-turn OpenAI-compatible coding agent
name: openai_compat
version: "1.0.0"
adapter: openai_compat
description: >
  Single-shot OpenAI-compatible chat agent. Model rewrites workspace files as JSON.
  Requires OPENAI_API_KEY and OPENAI_BASE_URL (or model base_url).
# Single-turn: every workspace file is pasted into the prompt, so there is nothing to
# retrieve (A2) and no second turn to react in (A3). Scoring this scaffold on a
# retrieval case measures whether extra pasted code helps, not whether it can search.
capability_axes: [A1, A4, A5, A6]
options:
  system_prompt: |
    You are a production coding assistant for automated benchmarks.
    Given a user task and existing files, implement a complete solution.
    Respond with a JSON object only (no markdown fences):
    {"files": [{"path": "...", "content": "..."}], "message": "brief summary"}
    Include every file you change with full file contents.
    Prefer minimal correct fixes that pass the provided tests.
  max_tokens: 8192
