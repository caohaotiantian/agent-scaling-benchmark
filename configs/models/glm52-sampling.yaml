# GLM-5.2 with stochastic sampling, for pass@k / repeated-sampling experiments.
#
# The temperature is the whole point: at temperature 0 the k samples of a pass@k run are the
# same sample k times, so pass@k collapses onto pass@1 and reports a scaling gain of exactly
# zero no matter how capable the agent is. Keep `glm52.yaml` (temperature 0) for reproducible
# single-shot runs and use this one whenever max_attempts > 1.
name: glm-5.2-sampling
provider: openai_compat
model: GLM-5.2
base_url: null # uses OPENAI_BASE_URL
api_key_env: OPENAI_API_KEY
temperature: 0.7
max_tokens: 8192
extra: {}
