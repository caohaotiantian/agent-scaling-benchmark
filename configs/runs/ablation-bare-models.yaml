# Model comparison with no scaffold, three repeats each.
#
# Three repeats are mandatory, not thorough: a single pass of the tool-loop version reported
# p = 0.0312 and three repeats of the same comparison returned p = 0.167. One run cannot
# support a ranking.
#
# Measured with this adapter, GLM-5.1 is fully deterministic across three repeats (0.0pp
# spread, identical case by case) and Deepseek-V4-Flash varies by 3.2pp, against 12.9 and 16.1
# under the tool loop.
case_set: _revmixed
baseline_experiment: bare-glm51-r1
parallel: 3
allow_weak_grader: false
runs:
  - experiment_name: bare-deepseek-r1
    algorithm_name: Deepseek-V4-Flash
    agent_config: configs/agents/bare_model.yaml
    model_config: configs/models/deepseek-v4-flash.yaml
    run_id: bare-deepseek-r1
    run_config: configs/runs/baseline-bare.yaml
  - experiment_name: bare-glm51-r1
    algorithm_name: GLM-5.1
    agent_config: configs/agents/bare_model.yaml
    model_config: configs/models/glm51.yaml
    run_id: bare-glm51-r1
    run_config: configs/runs/baseline-bare.yaml
  - experiment_name: bare-deepseek-r2
    algorithm_name: Deepseek-V4-Flash
    agent_config: configs/agents/bare_model.yaml
    model_config: configs/models/deepseek-v4-flash.yaml
    run_id: bare-deepseek-r2
    run_config: configs/runs/baseline-bare.yaml
  - experiment_name: bare-glm51-r2
    algorithm_name: GLM-5.1
    agent_config: configs/agents/bare_model.yaml
    model_config: configs/models/glm51.yaml
    run_id: bare-glm51-r2
    run_config: configs/runs/baseline-bare.yaml
  - experiment_name: bare-deepseek-r3
    algorithm_name: Deepseek-V4-Flash
    agent_config: configs/agents/bare_model.yaml
    model_config: configs/models/deepseek-v4-flash.yaml
    run_id: bare-deepseek-r3
    run_config: configs/runs/baseline-bare.yaml
  - experiment_name: bare-glm51-r3
    algorithm_name: GLM-5.1
    agent_config: configs/agents/bare_model.yaml
    model_config: configs/models/glm51.yaml
    run_id: bare-glm51-r3
    run_config: configs/runs/baseline-bare.yaml
