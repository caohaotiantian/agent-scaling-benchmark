# Forced choice between two human-written patches, over `_choice2`.
#
# Same two models, three repeats and adapter family as the repair and verdict runs, so the task
# is again the only thing that moved. 167 items from 58 files — the first set on this corpus
# large enough to see a ten-point effect.
#
# Read against a floor of 62%, not 50%. `scripts/review_case_gate.py` measures a bag-of-words
# matcher that picks whichever patch shares more identifiers with the issue at 103/167, and a
# "prefer the smaller diff" rule at 95/167. Both are below the 75% the four-way version leaked
# and the 67% the verdict version leaked, and unlike those two this residue is part of what
# review is: an issue names what it is about. It is still a floor, and the readout enforces it.
#
# Same two models, same three repeats and same adapter family as
# `configs/runs/ablation-widest-gap.yaml`, so the only thing that moved is the task: the solver
# judges a patch instead of writing one. That comparison is the whole point, and it is why the
# repeats and the model pair are copied rather than chosen afresh.
#
# Read the result against a floor of 67%, not 50%. `scripts/review_case_gate.py` rejected this
# set: the mean length of an added line separates the real fixes from the failed ones at 67%
# held-out balanced accuracy (permutation p = 0.025), because the real fix is always a human
# commit and the failed ones are always model output. The run is bought anyway, with that
# ceiling recorded in advance — a score inside 50–67% carries no information about review
# ability, and `scripts/review_readout.py` refuses to call such a result positive.
case_set: _choice2
baseline_experiment: choice-glm52-r1
parallel: 3
allow_weak_grader: false
runs:
  - experiment_name: choice-glm5-r1
    algorithm_name: GLM-5
    agent_config: configs/agents/bare_model_choice.yaml
    model_config: configs/models/glm5.yaml
    run_id: choice-glm5-r1
    run_config: configs/runs/baseline-bare.yaml
  - experiment_name: choice-glm52-r1
    algorithm_name: GLM-5.2
    agent_config: configs/agents/bare_model_choice.yaml
    model_config: configs/models/glm52.yaml
    run_id: choice-glm52-r1
    run_config: configs/runs/baseline-bare.yaml
  - experiment_name: choice-glm5-r2
    algorithm_name: GLM-5
    agent_config: configs/agents/bare_model_choice.yaml
    model_config: configs/models/glm5.yaml
    run_id: choice-glm5-r2
    run_config: configs/runs/baseline-bare.yaml
  - experiment_name: choice-glm52-r2
    algorithm_name: GLM-5.2
    agent_config: configs/agents/bare_model_choice.yaml
    model_config: configs/models/glm52.yaml
    run_id: choice-glm52-r2
    run_config: configs/runs/baseline-bare.yaml
  - experiment_name: choice-glm5-r3
    algorithm_name: GLM-5
    agent_config: configs/agents/bare_model_choice.yaml
    model_config: configs/models/glm5.yaml
    run_id: choice-glm5-r3
    run_config: configs/runs/baseline-bare.yaml
  - experiment_name: choice-glm52-r3
    algorithm_name: GLM-5.2
    agent_config: configs/agents/bare_model_choice.yaml
    model_config: configs/models/glm52.yaml
    run_id: choice-glm52-r3
    run_config: configs/runs/baseline-bare.yaml
