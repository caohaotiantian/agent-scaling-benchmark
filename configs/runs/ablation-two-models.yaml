# Two-model discrimination, repeated three times each.
#
# The single-pass version gave Deepseek-V4-Flash 90.3% against GLM-5.1's 71.0%, McNemar exact
# two-sided p = 0.0312 on 6 discordant pairs all in one direction. That p is the smallest value
# 6 discordant pairs can produce, so the result rests on the thinnest possible margin: one pair
# fewer and it is not significant.
#
# Three independent runs per model make the estimate stand on 93 paired observations instead of
# 31, and expose within-model variance, which a single pass cannot show at all.
#
# What the discriminating cases measure is worth naming: all 6 were GLM-5.1 exceeding max_steps
# rather than returning a wrong answer. This separates convergence within a step budget, not
# correctness.
case_set: _revmixed
baseline_experiment: two-glm51-r1
parallel: 3
allow_weak_grader: false
runs:
  - experiment_name: two-deepseek-r1
    algorithm_name: Deepseek-V4-Flash
    agent_config: configs/agents/tool_loop.yaml
    model_config: configs/models/deepseek-v4-flash.yaml
    run_id: two-deepseek-r1
    run_config: configs/runs/baseline-tool-loop.yaml
  - experiment_name: two-glm51-r1
    algorithm_name: GLM-5.1
    agent_config: configs/agents/tool_loop.yaml
    model_config: configs/models/glm51.yaml
    run_id: two-glm51-r1
    run_config: configs/runs/baseline-tool-loop.yaml
  - experiment_name: two-deepseek-r2
    algorithm_name: Deepseek-V4-Flash
    agent_config: configs/agents/tool_loop.yaml
    model_config: configs/models/deepseek-v4-flash.yaml
    run_id: two-deepseek-r2
    run_config: configs/runs/baseline-tool-loop.yaml
  - experiment_name: two-glm51-r2
    algorithm_name: GLM-5.1
    agent_config: configs/agents/tool_loop.yaml
    model_config: configs/models/glm51.yaml
    run_id: two-glm51-r2
    run_config: configs/runs/baseline-tool-loop.yaml
  - experiment_name: two-deepseek-r3
    algorithm_name: Deepseek-V4-Flash
    agent_config: configs/agents/tool_loop.yaml
    model_config: configs/models/deepseek-v4-flash.yaml
    run_id: two-deepseek-r3
    run_config: configs/runs/baseline-tool-loop.yaml
  - experiment_name: two-glm51-r3
    algorithm_name: GLM-5.1
    agent_config: configs/agents/tool_loop.yaml
    model_config: configs/models/glm51.yaml
    run_id: two-glm51-r3
    run_config: configs/runs/baseline-tool-loop.yaml
