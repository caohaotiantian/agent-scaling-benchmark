# Does the hidden-test dose buy DISCRIMINATION, or only difficulty?
#
# The dose-response measured difficulty and nothing else: one model, GLM-5.1, went from 19 of
# 19 solved with nothing hidden to 11 of 19 with four hidden, and 8 cases moved into the band
# where they are sometimes solved. That is a difficulty dial. It is not yet a discriminative
# benchmark, because two models can move down together and still be inseparable -- which is
# exactly what the same 19 cases did at zero dose, where both sat at 100%.
#
# This run puts both models at the dose that moved the most cases without pushing any into
# "nobody solves", and asks the only question that matters: on how many cases do they differ.
#
# For reference on the same 19 cases:
#   opencode, nothing hidden : GLM-5.1 100%, Deepseek 100%, 0 discordant of 19
#   bare_model               : GLM-5.1 89.5%, Deepseek 82.5%, 1 discordant of 19
#
# One case, rev-2ca580a0192883ce, is known contaminated: its hidden test calls
# `create_shared_strings`, a name that appears in neither the visible code nor the prompt, so
# no solver can infer it. It stays in for the paired comparison -- a case both models fail is
# concordant and cannot bias the count -- and the result is reported with and without it.
#
# 2 models x 19 cases x 3 repeats = 114 case-runs.
case_set: _revp4
baseline_experiment: disc-glm51-r1
parallel: 3
allow_weak_grader: false
runs:
  - experiment_name: disc-glm51-r1
    algorithm_name: GLM-5.1
    agent_config: configs/agents/opencode.yaml
    model_config: configs/models/glm51.yaml
    run_id: disc-glm51-r1
    run_config: configs/runs/baseline-opencode.yaml
  - experiment_name: disc-deepseek-r1
    algorithm_name: Deepseek-V4-Flash
    agent_config: configs/agents/opencode.yaml
    model_config: configs/models/deepseek-v4-flash.yaml
    run_id: disc-deepseek-r1
    run_config: configs/runs/baseline-opencode.yaml
  - experiment_name: disc-glm51-r2
    algorithm_name: GLM-5.1
    agent_config: configs/agents/opencode.yaml
    model_config: configs/models/glm51.yaml
    run_id: disc-glm51-r2
    run_config: configs/runs/baseline-opencode.yaml
  - experiment_name: disc-deepseek-r2
    algorithm_name: Deepseek-V4-Flash
    agent_config: configs/agents/opencode.yaml
    model_config: configs/models/deepseek-v4-flash.yaml
    run_id: disc-deepseek-r2
    run_config: configs/runs/baseline-opencode.yaml
  - experiment_name: disc-glm51-r3
    algorithm_name: GLM-5.1
    agent_config: configs/agents/opencode.yaml
    model_config: configs/models/glm51.yaml
    run_id: disc-glm51-r3
    run_config: configs/runs/baseline-opencode.yaml
  - experiment_name: disc-deepseek-r3
    algorithm_name: Deepseek-V4-Flash
    agent_config: configs/agents/opencode.yaml
    model_config: configs/models/deepseek-v4-flash.yaml
    run_id: disc-deepseek-r3
    run_config: configs/runs/baseline-opencode.yaml
